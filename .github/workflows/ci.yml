name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # Weekly full run: adds the scheduled matrix legs (e.g. the runtime floor)
  # that per-push runs explicitly omit. The derivation script logs every
  # omitted combination, so a reduced run never reads as full coverage.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-matrix:
    # The .NET versions CI claims to support are derived from the repository's
    # own version files (global.json SDK pin + committed target frameworks),
    # never from a hand-written list here - a separate list would drift away
    # from the truth and then prove the wrong thing. The derivation script is
    # also the unsupported-version gate: it fails the run before any build
    # starts when the version files contradict each other.
    runs-on: windows-latest

    outputs:
      legs: ${{ steps.derive.outputs.legs }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Derive version matrix from repository version files
        id: derive
        shell: pwsh
        run: |
          $includeScheduled = @('schedule', 'workflow_dispatch') -contains '${{ github.event_name }}'
          .\scripts\omp\get-ci-version-matrix.ps1 -IncludeScheduled:$includeScheduled

  gates:
    # Repository hygiene and validator gates. These do not depend on the .NET
    # version, so they run once, not per matrix leg.
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine base commit
        id: base
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:PR_BASE_SHA) {
            echo "sha=$env:PR_BASE_SHA" >> $env:GITHUB_OUTPUT
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:PUSH_BEFORE -and $env:PUSH_BEFORE -notmatch '^0+$') {
            echo "sha=$env:PUSH_BEFORE" >> $env:GITHUB_OUTPUT
          } else {
            echo "sha=origin/main" >> $env:GITHUB_OUTPUT
          }

      - name: Validate repository hygiene
        shell: pwsh
        run: |
          $forbidden = @(
            '.idea/',
            '.vs/',
            '.vscode/',
            '.DS_Store',
            'Thumbs.db',
            '.coverage',
            '.coveragexml'
          )

          # R12-A21. Two problems, both of the kind that make a gate report a pass
          # it never earned.
          #
          # First: 'git ls-files' was not checked. A failed call returns nothing,
          # nothing matches, and the step prints success -- the same fail-open
          # shape R7-G8 removed from validate-component-versions.ps1.
          #
          # Second: the results were collected in $matches, which is PowerShell's
          # AUTOMATIC variable, rewritten by every -match in the same scope.
          # Assigning to it is legal and silent. Nothing between the assignment and
          # the test uses -match today, so the check happens to work; adding one
          # line that does would quietly change what 'if ($matches)' asks. The same
          # pattern was already fixed in the validator (see its comment at the
          # ProjectReference regex) and this copy was missed.
          $files = @(git ls-files)
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::'git ls-files' exited with $LASTEXITCODE; the forbidden-file check could not run."
            exit 1
          }

          $forbiddenFound = foreach ($file in $files) {
            foreach ($pattern in $forbidden) {
              if ($file -like "*$pattern*") {
                $file
                break
              }
            }
          }

          if ($forbiddenFound) {
            Write-Host 'Forbidden files were found in the repository:'
            $forbiddenFound | Sort-Object -Unique | ForEach-Object { Write-Host " - $_" }
            exit 1
          }

      - name: Validate module definitions
        shell: pwsh
        run: .\scripts\omp\validate-module-definitions.ps1

      - name: Validate component versions
        shell: pwsh
        run: .\scripts\omp\validate-component-versions.ps1 -BaseCommit '${{ steps.base.outputs.sha }}'

      - name: Analyze PowerShell scripts (security + PS5.1 compat)
        shell: pwsh
        run: .\scripts\omp\run-script-analyzer.ps1

      - name: Install pinned Pester for the script test suites
        # run-script-tests.ps1 pins Pester 5.9.1 (the suites were migrated off
        # the Pester 3.4.0 legacy dialect in 2026-09). The windows-latest image
        # carries 3.4.0 inbox and a floating 5.x, so install the exact pin when
        # it is missing. Runs under Windows PowerShell on purpose: the module
        # must land where powershell.exe (not pwsh) can import it.
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [Version]'5.9.1' })) {
            Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run Pester script tests
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File .\scripts\omp\run-script-tests.ps1

  build-test:
    # One leg per supported .NET configuration, derived by the version-matrix
    # job. fail-fast is off: a leg that fails must not hide how the other
    # supported versions behaved.
    needs: version-matrix
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version-matrix.outputs.legs) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK (${{ matrix.name }})
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Install floor runtime (${{ matrix.runtimeFloor }})
        # Scheduled legs pin the test hosts to the oldest runtime patch of the
        # supported major. Installing that SDK band brings its bundled runtime
        # along; global.json keeps dotnet itself on the pinned SDK.
        if: ${{ matrix.runtimeFloor != '' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.runtimeFloor }}

      - name: Pin SDK resolution to exactly ${{ matrix.sdk }}
        # Measured 2026-08-28 on windows-latest: the hosted image carries newer
        # SDK bands in C:\Program Files\dotnet (and sets DOTNET_ROOT there), so
        # a leg that asks setup-dotnet for 10.0.200 still resolves and builds on
        # the image's 10.0.400 under rollForward latestFeature - a 'pinned' leg
        # that proves nothing. For exact-pin legs the workspace global.json is
        # narrowed to rollForward=disable, which makes the muxer pick exactly
        # the SDK this leg installed. The pushed file is untouched; this edits
        # only the runner's checkout.
        if: ${{ matrix.pinExact == 'true' }}
        shell: pwsh
        run: |
          $gj = Get-Content global.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $gj.sdk.rollForward = 'disable'
          ($gj | ConvertTo-Json -Depth 4) | Set-Content global.json -Encoding UTF8
          Write-Host "Leg '${{ matrix.name }}' narrowed global.json rollForward to 'disable'; expecting exactly SDK ${{ matrix.sdk }}."

      - name: Show leg purpose and .NET SDK info
        shell: pwsh
        run: |
          Write-Host "Leg '${{ matrix.name }}': ${{ matrix.purpose }}"
          Write-Host "Cadence: ${{ matrix.cadence }} (scheduled legs run on the weekly schedule and workflow_dispatch only)"
          dotnet --info
          dotnet --list-runtimes

      - name: Assert installed SDK is on the supported major
        # Second layer of the unsupported-version gate (the first is the
        # derivation script): whatever global.json and setup-dotnet resolved,
        # the SDK that will actually build must be on the major the target
        # frameworks claim, and an exact-pin leg must have kept its pin.
        #
        # The check lives in scripts/omp/assert-leg-sdk.ps1 rather than inline
        # here, because inline workflow code cannot be tested -- and that
        # mattered: the 2026-08-28 sabotage meant to prove this gate red came
        # back GREEN (run 33182860062, leg "SABOTAGE: unsupported .NET major,
        # the gate must fail" reported success), since the fix landed after the
        # sabotage was removed. As a script the gate is proven red by
        # tests/Assert-LegSdk.Tests.ps1 on every CI run and every pre-push.
        shell: pwsh
        run: |
          $sdk = dotnet --version
          if ($LASTEXITCODE -ne 0) { $sdk = '' }
          ./scripts/omp/assert-leg-sdk.ps1 `
            -ResolvedSdk "$sdk" `
            -ExpectedMajor '${{ matrix.expectedMajor }}' `
            -PinnedSdk '${{ matrix.sdk }}' `
            -PinExact '${{ matrix.pinExact }}' `
            -LegName '${{ matrix.name }}'

      - name: Restore solution
        run: dotnet restore OpenModulePlatform.slnx

      - name: Build solution
        run: dotnet build OpenModulePlatform.slnx --configuration Release --no-restore

      - name: Start SQL Server LocalDB for integration tests
        shell: pwsh
        run: |
          sqllocaldb info MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { sqllocaldb create MSSQLLocalDB }
          sqllocaldb start MSSQLLocalDB

      - name: Test
        shell: pwsh
        env:
          OMP_TEST_CONNECTION_STRING: 'Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true'
          OMP_TEST_CLEANUP_LOG: '${{ github.workspace }}/TestResults/cleanup-failures.log'
        run: |
          # Gate the deterministic, self-provisioning tests: HostAgent.Runtime,
          # Web.Shared.Analyzers, and the Portal unit tests all create their own
          # schema on the started LocalDB. The Portal *Integration* tests and the
          # HostDeploymentLease tests depend on a bootstrap-seeded OMP database
          # (sql/2-initialize refuses to run until the bootstrap-admin placeholder
          # is replaced) and are environment-fragile on LocalDB, so they are
          # excluded here and remain runnable locally against a provisioned DB.
          # Category=Ui (Playwright invariant scans) is likewise excluded: it
          # needs a Chromium download and a seeded OMP database to boot the apps.
          # Exclusions are tracked in docs/TEST_DEBT.md; keep that register in
          # sync in the same commit when this filter changes.
          if ('${{ matrix.runtimeFloor }}' -ne '') {
            # Runtime-floor leg: the test hosts' runtimeconfig requests the
            # oldest patch of the supported major; Disable forbids rolling
            # forward to whatever newer runtime the image happens to carry, so
            # the suite provably runs on the floor the platform claims to
            # support.
            $env:DOTNET_ROLL_FORWARD = 'Disable'
            Write-Host "runtime-floor leg: DOTNET_ROLL_FORWARD=Disable, test hosts load exactly runtime ${{ matrix.runtimeFloor }}"
          }
          # Make the exclusions visible the same way LogSearch does: count the
          # tests the filter excludes, so an exclusion never reads as coverage.
          $excludeFilter = 'FullyQualifiedName~Portal.Tests.Integration|FullyQualifiedName~Portal.Tests.Services.OmpHostArtifactRepositoryHostDeploymentLeaseTests|Category=Ui'
          $listOutput = dotnet test OpenModulePlatform.slnx --configuration Release --no-build --filter $excludeFilter --list-tests
          if ($LASTEXITCODE -ne 0) { $listOutput | ForEach-Object { Write-Host $_ }; exit $LASTEXITCODE }
          $excludedCount = @($listOutput | Where-Object { $_ -match '^\s{4}\S' }).Count
          Write-Host "Excluded: $excludedCount tests (Portal.Tests.Integration, HostDeploymentLease, Category=Ui) - exclusions tracked in docs/TEST_DEBT.md"
          dotnet test OpenModulePlatform.slnx --configuration Release --no-build --logger trx --results-directory TestResults --filter "FullyQualifiedName!~Portal.Tests.Integration&FullyQualifiedName!~Portal.Tests.Services.OmpHostArtifactRepositoryHostDeploymentLeaseTests&Category!=Ui"

      - name: Verify test execution
        # A filter that matches zero tests still lets VSTest exit 0; turn that
        # false green red by asserting the TRX counters show executed > 0.
        # -RequirePerFile is deliberately NOT set here: the UiTests project is
        # entirely Category=Ui, so its .trx legitimately shows 0 executed under
        # this filter and a per-file requirement would fail a healthy run.
        # The local gate (scripts/local-ci.ps1) tests named non-UI projects
        # individually and DOES enforce -RequirePerFile there.
        shell: powershell
        run: powershell -File scripts\omp\assert-tests-executed.ps1 -ResultsDirectory TestResults -SuiteName "CI gate (Integration/lease/Ui excluded)" -ShowSkipReasons

      - name: Surface test-database cleanup failures
        if: always()
        shell: pwsh
        run: |
          # Test fixtures report failed drops/sweeps to this log file because xUnit
          # captures Console.Error per test and hides it for passing tests -- invisible
          # in this workflow's console output. Emit each line as a workflow warning so
          # a failed cleanup step is visible in the run summary and log instead.
          $log = 'TestResults/cleanup-failures.log'
          if ((Test-Path $log) -and (Get-Item $log).Length -gt 0) {
            Get-Content $log | ForEach-Object {
              $escaped = $_ -replace '%', '%25'
              Write-Host "::warning::$escaped"
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults
